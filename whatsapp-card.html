<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: #0a0c14;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Hero image — fills everything except footer ── */
  .hero-wrap {
    flex: 1;
    padding: 32px 32px 20px;
    position: relative;
    overflow: hidden;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    background-image: url('thumbnail-cropped.png');
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
  }

  /* ── Footer ── */
  .footer {
    flex-shrink: 0;
    padding: 14px 40px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon { width: 36px; height: 36px; object-fit: contain; }

  .brand-name {
    font-size: 24px;
    font-weight: 800;
    color: #e0e6f0;
  }

  .url {
    font-size: 24px;
    font-weight: 700;
    color: #5fa8e8;
  }
</style>
</head>
<body>

  <!-- Hero image from website -->
  <div class="hero-wrap">
    <div class="hero-img"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="brand">
      <img class="brand-icon" src="logo-128.png" alt="Chill Pill">
      <div class="brand-name">Chill Pill</div>
    </div>
    <div class="url">getchillpill.xyz</div>
  </div>

</body>
</html>
